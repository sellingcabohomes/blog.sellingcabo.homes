title: SellingCabo.Homes
email: sdelapena@ronival.com
description: >-
  A real estate blog about buying and selling homes in Los Cabos, Mexico. Published by Sebastian Dee, a Los Cabos real estate agent with Ronival Real Estate. This site shares insights on the buying and selling process, new developments, market updates, and life in Los Cabos for homeowners and investors.
baseurl: ""
url: "https://blog.sellingcabo.homes"
author: Sebastian Dee <br> Los Cabos Real Estate Agent <br>Selling Cabo Homes
facebook_username: sebastiandeehomes
instagram_username: sebastiandeehomes
linkedin_username: sebastiandeehomes

# Build settings
theme: minima
plugins:
 - jekyll-feed
 - jekyll-sitemap

google_analytics: G-RXQGE2R4V8

