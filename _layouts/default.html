<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="Ew9OAW20gmx9OpyWvxr1Ke2vbwnCugEhIkfw-0VngVY" />
 <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .section-divider {
            border-top: 2px dashed #e2e8f0;
            margin: 3rem auto;
            width: 90%;
        }
    </style>
    
    {%- seo -%}
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/custom.css" | relative_url }}">
    {%- feed_meta -%}
    {%- if jekyll.environment == 'production' and site.google_analytics -%}
      {%- include analytics.html -%}
    {%- endif -%}
  </head>

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
    
    <script src="{{ "/assets/minima-social-icons.js" | relative_url }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Helper functions to format numbers
        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(value);
        }
        function formatNumber(value) {
            return new Intl.NumberFormat('en-US').format(value);
        }

        // Apply formatting
        const currencyElements = document.querySelectorAll('[data-format="currency"]');
        const numberElements = document.querySelectorAll('[data-format="number"]');
        currencyElements.forEach(el => {
            const value = parseFloat(el.textContent);
            if (!isNaN(value)) {
                el.textContent = formatCurrency(value);
            }
        });
        numberElements.forEach(el => {
            const value = parseFloat(el.textContent);
            if (!isNaN(value)) {
                el.textContent = formatNumber(value);
            }
        });
    });
</script>
  </body>

</html>
